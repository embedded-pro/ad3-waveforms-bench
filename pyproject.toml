[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ad3-waveforms-bench"
dynamic = ["version"]
description = "Drive a Digilent Analog Discovery 3 through the WaveForms SDK for hardware-in-the-loop test benches"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pytest>=7.4"]
keywords = ["analog discovery", "digilent", "waveforms", "hardware-in-the-loop", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest-cov>=5",
    "ruff>=0.5",
    "twine>=5",
    "types-pyserial",
]

[project.urls]
Homepage = "https://github.com/embedded-pro/ad3-waveforms-bench"
Issues = "https://github.com/embedded-pro/ad3-waveforms-bench/issues"
Changelog = "https://github.com/embedded-pro/ad3-waveforms-bench/blob/main/CHANGELOG.md"

[project.scripts]
ad3-bench-console = "ad3_waveforms_bench.console:main"
ad3-bench-server = "ad3_waveforms_bench.remote.server:main"

[project.entry-points.pytest11]
ad3_waveforms_bench = "ad3_waveforms_bench.pytest_plugin"

[tool.setuptools.packages.find]
include = ["ad3_waveforms_bench*"]

[tool.setuptools.package-data]
ad3_waveforms_bench = ["py.typed"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::pytest.PytestUnknownMarkWarning",
    # pyserial's RFC2217 client still uses the pre-3.10 threading API
    "ignore:setDaemon\\(\\) is deprecated:DeprecationWarning:serial",
    "ignore:setName\\(\\) is deprecated:DeprecationWarning:serial",
]

[tool.coverage.run]
source = ["ad3_waveforms_bench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
files = ["ad3_waveforms_bench"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905"]
