[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ad3-waveforms-bench"
version = "0.2.0"
description = "Drive a Digilent Analog Discovery 3 through the WaveForms SDK for hardware-in-the-loop test benches"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5", "pytest>=7.4"]
keywords = ["analog discovery", "digilent", "waveforms", "hardware-in-the-loop", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest-cov>=5",
    "ruff>=0.5",
    "twine>=5",
    "types-pyserial",
]

[project.urls]
Homepage = "https://github.com/embedded-pro/ad3-waveforms-bench"
Issues = "https://github.com/embedded-pro/ad3-waveforms-bench/issues"
Changelog = "https://github.com/embedded-pro/ad3-waveforms-bench/blob/main/CHANGELOG.md"

[project.scripts]
ad3-bench-console = "ad3_waveforms_bench.console:main"
ad3-bench-server = "ad3_waveforms_bench.remote.server:main"

[project.gui-scripts]
ad3-bench-gui = "ad3_waveforms_bench.gui.__main__:main"

[project.entry-points.pytest11]
ad3_waveforms_bench = "ad3_waveforms_bench.pytest_plugin"

[tool.setuptools.packages.find]
include = ["ad3_waveforms_bench*"]

[tool.setuptools.package-data]
ad3_waveforms_bench = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::pytest.PytestUnknownMarkWarning"]

[tool.coverage.run]
source = ["ad3_waveforms_bench"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
files = ["ad3_waveforms_bench"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905"]
