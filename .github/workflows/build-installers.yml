name: Build Installers

on:
  # Called by release-please.yml after release-please created the release.
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
  # Manual backfill: Actions -> Build Installers -> Run workflow -> tag_name
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag to upload the installers to (e.g. v0.2.0)
        required: true
        type: string
  # Build check (no upload) when the GUI or the installer files change.
  pull_request:
    paths:
      - "ad3_waveforms_bench/gui/**"
      - "ad3-bench-gui.spec"
      - "installer/**"
      - "scripts/generate_icon.py"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag_name || github.ref }}
  cancel-in-progress: true

env:
  TAG_NAME: ${{ inputs.tag_name }}

jobs:
  # ── Windows ──────────────────────────────────────────────────────────────
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python dependencies
        run: pip install ".[gui]" pyinstaller

      - name: Generate icon files
        run: python scripts/generate_icon.py

      - name: Build with PyInstaller
        run: pyinstaller ad3-bench-gui.spec

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $p = Start-Process dist\ad3-bench-gui.exe -ArgumentList "--help" -PassThru -Wait
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      # Inno Setup is pre-installed on windows-latest runners.
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = if ($env:TAG_NAME) { $env:TAG_NAME.TrimStart("v") } else { "0.0.0" }
          iscc installer/windows/setup.iss /DAppVersion=$ver
          $src  = "installer-output\ad3-bench-server-$ver-windows-setup.exe"
          $dest = "ad3-bench-server-$ver-windows-setup.exe"
          Move-Item $src $dest
          "INSTALLER=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to GitHub Release
        if: env.TAG_NAME != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG_NAME" "$env:INSTALLER" --clobber --repo "$env:GITHUB_REPOSITORY"

      - name: Upload build artifact
        if: env.TAG_NAME == ''
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: ${{ env.INSTALLER }}

  # ── Linux ─────────────────────────────────────────────────────────────────
  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libfontconfig1 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-util1 libdbus-1-3

      - name: Install Python dependencies
        run: pip install ".[gui]" pyinstaller

      - name: Generate icon files
        # QT_QPA_PLATFORM=offscreen renders QPixmap without a real display.
        run: QT_QPA_PLATFORM=offscreen python scripts/generate_icon.py

      - name: Build with PyInstaller (onedir)
        run: pyinstaller ad3-bench-gui.spec

      - name: Smoke-test the bundle
        run: dist/ad3-bench-gui/ad3-bench-gui --help

      - name: Download appimagetool
        run: |
          curl -Lo appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/ad3-bench-gui/* AppDir/usr/bin/
          cp installer/linux/ad3-bench-server.desktop AppDir/
          cp installer/linux/AppRun AppDir/
          chmod +x AppDir/AppRun
          # Icon name must match Icon= in the .desktop file
          cp assets/icon.png AppDir/ad3-bench-server.png
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/ad3-bench-server.png

      - name: Build AppImage
        run: |
          ver="${TAG_NAME#v}"
          ver="${ver:-0.0.0}"
          # --appimage-extract-and-run runs appimagetool without FUSE, which the runners lack.
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            AppDir "ad3-bench-server-${ver}-x86_64.AppImage"
          echo "APPIMAGE=ad3-bench-server-${ver}-x86_64.AppImage" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        if: env.TAG_NAME != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG_NAME" "$APPIMAGE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload build artifact
        if: env.TAG_NAME == ''
        uses: actions/upload-artifact@v7
        with:
          name: linux-appimage
          path: ${{ env.APPIMAGE }}
