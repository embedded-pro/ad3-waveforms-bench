name: Release

# Builds the sdist and wheel of a release tag and attaches them to its GitHub release.
# Called by release-please.yml (which also publishes the files to PyPI); run it by hand to backfill a tag.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Tag to build (e.g. v0.2.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check that the version matches the tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          ls dist/
          test -f "dist/ad3_waveforms_bench-${TAG_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
